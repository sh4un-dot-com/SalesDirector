name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux AppImage + Flatpak + Native Packages
            os: ubuntu-latest
            build_command: npm run dist:linux:ci
            artifact_name: desktop-linux
            artifact_path: |
              release/*.AppImage
              release/*.flatpak
              release/*.rpm
              release/*.pacman
            disable_signing: ''
            linux_setup: |
              sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder rpm libarchive-tools xz-utils
              sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
              sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08
          - name: macOS DMG
            os: macos-latest
            build_command: npm run dist:mac:ci
            artifact_name: desktop-macos
            artifact_path: |
              release/*.dmg
              release/*.blockmap
            disable_signing: 'false'
            linux_setup: ''
          - name: Windows Installer
            os: windows-latest
            build_command: npm run dist:win
            artifact_name: desktop-windows
            artifact_path: |
              release/*.exe
              release/*.blockmap
            disable_signing: ''
            linux_setup: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: ${{ matrix.platform.linux_setup }}

      - name: Run tests
        run: npm test

      - name: Build desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform.disable_signing }}
        run: ${{ matrix.platform.build_command }}

      - name: Build Flatpak (Linux only)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npm run dist:linux:flatpak

      - name: Smoke test Windows app startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = (Resolve-Path 'release/win-unpacked/SalesDirector.exe').Path
          if (-not (Test-Path $exePath)) {
            throw "Expected Windows executable not found: $exePath"
          }

          $process = Start-Process -FilePath $exePath -ArgumentList '--ci-smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Windows renderer smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.flatpak
            release-artifacts/*.rpm
            release-artifacts/*.pacman
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.blockmap
