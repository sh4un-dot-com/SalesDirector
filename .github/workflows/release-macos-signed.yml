name: Release macOS Signed DMG (Manual)

on:
  workflow_dispatch:

jobs:
  release-macos-signed:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate signing secrets
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets['MAC_CERTIFICATE_P12_BASE64'] }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets['MAC_CERTIFICATE_PASSWORD'] }}
          APPLE_ID: ${{ secrets['APPLE_ID'] }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets['APPLE_APP_SPECIFIC_PASSWORD'] }}
          APPLE_TEAM_ID: ${{ secrets['APPLE_TEAM_ID'] }}
        run: |
          missing=0
          for key in MAC_CERTIFICATE_P12_BASE64 MAC_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare signing certificate
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets['MAC_CERTIFICATE_P12_BASE64'] }}
        run: |
          echo "$MAC_CERTIFICATE_P12_BASE64" | base64 --decode > mac-signing-cert.p12

      - name: Build signed and notarized DMG
        env:
          CSC_LINK: ${{ github.workspace }}/mac-signing-cert.p12
          CSC_KEY_PASSWORD: ${{ secrets['MAC_CERTIFICATE_PASSWORD'] }}
          APPLE_ID: ${{ secrets['APPLE_ID'] }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets['APPLE_APP_SPECIFIC_PASSWORD'] }}
          APPLE_TEAM_ID: ${{ secrets['APPLE_TEAM_ID'] }}
        run: npm run dist:mac:signed

      - name: Verify codesigning and Gatekeeper acceptance
        run: |
          APP_PATH=$(find release -name "*.app" | head -n 1)
          DMG_PATH=$(find release -name "*.dmg" | head -n 1)

          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ]; then
            echo "Expected .app and .dmg outputs were not found in release/."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"

      - name: Upload signed DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-dmg
          path: release/*.dmg
          if-no-files-found: error

      - name: Cleanup signing certificate
        if: always()
        run: rm -f mac-signing-cert.p12
